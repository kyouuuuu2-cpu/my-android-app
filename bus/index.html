<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京都バス まとめ</title>
<style>
  :root { --bg:#eef1ee; --card:#fff; --fg:#1d2a22; --muted:#5d6b62; --accent:#3a7d55; --line:#cfd8d1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a16; --card:#1e2621; --fg:#e6ece7; --muted:#9aa89f; --accent:#5fb07f; --line:#2f3a33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font: 15px/1.4 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: env(safe-area-inset-top,0px) max(10px, env(safe-area-inset-right,0px)) 24px max(10px, env(safe-area-inset-left,0px)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; flex:1; }
  button { font: inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--fg);
    border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stop { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-top:12px; overflow:hidden; }
  .stop-head { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); }
  .stop-head b { flex:1; font-size:16px; }
  .stop-head a { color:var(--accent); font-size:13px; text-decoration:none; }
  .frame { height: var(--h); overflow:hidden; position:relative; background:#000; }
  .frame iframe { border:0; width:100%; display:block;
    height: calc(var(--h) + var(--top)); margin-top: calc(-1 * var(--top)); }
  .full .frame { height: 640px; }
  .full .frame iframe { height: 640px; margin-top: 0; }
  .adj { display:none; align-items:center; gap:4px; font-size:13px; color:var(--muted); }
  .adjusting .adj { display:flex; }
  .adj button { padding:2px 9px; }
  #topAdj { padding:8px 0 0; }
  .note { color:var(--muted); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<header>
  <h1>京都市バス 接近まとめ</h1>
  <button id="adjBtn">調整</button>
  <button id="reload" class="primary">全部更新</button>
</header>
<div id="topAdj" class="adj">上の切り取り位置 <button data-top="-5">↑</button><button data-top="5">↓</button> <span id="topVal"></span>
  <button id="fullBtn" style="margin-left:auto">全体表示</button></div>
<main id="list"></main>
<p class="note">各ページは30秒ごとに自動更新されます。表示がずれたら「調整」で、上の位置（↑↓）と各停留所の行数（−＋）を合わせてください。設定はこの端末に保存されます。</p>

<script>
const BASE = "https://kyotocity.bus-navigation.jp/wgsys/wgs_kyt/approachGuidance.htm?";
const STOPS = [
  { name: "西大路七条", q: "tabName=approachGuidance&selectedLandmarkCatCd=&from=西大路七条&fromType=1&to=&toType=&locale=ja&fromlat=34.989179&fromlng=135.732404&tolat=&tolng=&fromSignpoleKey=&routeLayoutCd=&bsid=1&fromBusStopCd=&toBusStopCd=&mapFlag=true&existYn=&routeKey=&nextDiagramFlag=&diaRevisedDate=&timeTableDirevtionCd=&searchDate=&searchTime=&fromBusStopKey=&toBusStopKey=&lineSelected=0010&targetTabName=mapSearchTab&informationTextId=&busStopName=西大路七条&search_map_from=西大路七条&search_map_to=&routeKeys=10511%2C9791%2C9789%2C9788_9867%2C9866&fromDisplayPassNo=16%2C34%2C17%2C37_16%2C35&toDisplayPassNo=&routeKeynum=2&busCode=&formerApproachLat=34.98332&formerApproachLng=135.732573&formerApproachGuidance=3359%3A6%3A2&informationFromTextId=&informationToTextId=&informationRouteId=9790%3Afalse%3A0%3A%3A%3A19700101090000000&busstopCdnum=&autoRefreshTime=30&vehicleScrollPosition=0&destinationCd=013013T01%2C043020001&fromSignpoleStringKey=28818%2C28818%2C28818%2C28818_28818%2C28818&routeSelectNo=0", rows: 2 },
  { name: "七条御前通", q: "tabName=approachGuidance&selectedLandmarkCatCd=&from=七条御前通&fromType=1&to=&toType=&locale=ja&fromlat=34.989153&fromlng=135.736216&tolat=&tolng=&fromSignpoleKey=&routeLayoutCd=&bsid=1&fromBusStopCd=&toBusStopCd=&mapFlag=true&existYn=&routeKey=&nextDiagramFlag=&diaRevisedDate=&timeTableDirevtionCd=&searchDate=&searchTime=&fromBusStopKey=&toBusStopKey=&lineSelected=0010&targetTabName=mapSearchTab&informationTextId=&busStopName=七条御前通&search_map_from=西大路七条&search_map_to=&routeKeys=10024%2C9991%2C10015%2C10026_10014%2C9992%2C10013_10041%2C10165_9856%2C9857&fromDisplayPassNo=23%2C49%2C16%2C23_15%2C45%2C23_12%2C12_25%2C24&toDisplayPassNo=&routeKeynum=4&busCode=&formerApproachLat=34.98332&formerApproachLng=135.732573&formerApproachGuidance=3359%3A6%3A2&informationFromTextId=&informationToTextId=&informationRouteId=9790%3Afalse%3A0%3A%3A%3A19700101090000000&busstopCdnum=&autoRefreshTime=30&vehicleScrollPosition=0&destinationCd=205010006%2C205010009%2C208020004%2C033033T03&fromSignpoleStringKey=28563%2C28563%2C28563%2C28563_28563%2C28563%2C28563_28563%2C28563_28563%2C28563&routeSelectNo=0", rows: 4 },
  { name: "四条大宮", q: "tabName=approachGuidance&selectedLandmarkCatCd=&from=四条大宮&fromType=1&to=&toType=&locale=ja&fromlat=35.003702&fromlng=135.749022&tolat=&tolng=&fromSignpoleKey=&routeLayoutCd=&bsid=1&fromBusStopCd=&toBusStopCd=&mapFlag=true&existYn=&routeKey=&nextDiagramFlag=&diaRevisedDate=&timeTableDirevtionCd=&searchDate=&searchTime=&fromBusStopKey=&toBusStopKey=&lineSelected=0010&targetTabName=mapSearchTab&informationTextId=&busStopName=四条大宮&search_map_from=七条御前通&search_map_to=&routeKeys=9790%2C9788%2C9791_9792&fromDisplayPassNo=4%2C4%2C1_4&toDisplayPassNo=&routeKeynum=2&busCode=&formerApproachLat=34.98332&formerApproachLng=135.732573&formerApproachGuidance=4403%3A6%3A3%244231%3A6%3A2&informationFromTextId=&informationToTextId=&informationRouteId=9790%3Afalse%3A0%3A%3A%3A19700101090000000&busstopCdnum=&autoRefreshTime=30&vehicleScrollPosition=0&destinationCd=013010001%2C013T10001&fromSignpoleStringKey=28351%2C28351%2C28351_28351&routeSelectNo=0", rows: 2 }
];

const ROW = 96;             // 1系統ぶんの高さ(px)
let cfg = { top: 350, rows: {} };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("busCfg") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("busCfg", JSON.stringify(cfg)); } catch (e) {} };

const list = document.getElementById("list");
const frames = [];
STOPS.forEach(s => {
  const url = BASE + s.q;
  const sec = document.createElement("section");
  sec.className = "stop";
  sec.innerHTML = `<div class="stop-head"><b></b>
      <span class="adj">行数 <button data-d="-1">−</button><span class="n"></span><button data-d="1">＋</button></span>
      <a target="_blank" rel="noopener">開く ↗</a></div>
    <div class="frame"><iframe loading="eager"></iframe></div>`;
  sec.querySelector("b").textContent = s.name;
  sec.querySelector("a").href = url;
  const frame = sec.querySelector(".frame");
  const n = sec.querySelector(".n");
  const apply = () => {
    const r = cfg.rows[s.name] ?? s.rows;
    n.textContent = r;
    frame.style.setProperty("--h", (r * ROW + 2) + "px");
  };
  sec.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    cfg.rows[s.name] = Math.max(1, (cfg.rows[s.name] ?? s.rows) + Number(b.dataset.d));
    save(); apply();
  });
  apply();
  const f = sec.querySelector("iframe");
  f.title = s.name; f.src = url;
  frames.push({ f, url });
  list.appendChild(sec);
});

function applyTop() {
  document.documentElement.style.setProperty("--top", cfg.top + "px");
  document.getElementById("topVal").textContent = cfg.top + "px";
}
document.querySelectorAll("[data-top]").forEach(b => b.onclick = () => {
  cfg.top = Math.max(0, cfg.top + Number(b.dataset.top)); save(); applyTop();
});
applyTop();

document.getElementById("adjBtn").onclick = () => document.body.classList.toggle("adjusting");
document.getElementById("fullBtn").onclick = () => document.body.classList.toggle("full");
document.getElementById("reload").onclick = () =>
  frames.forEach(({ f, url }) => { f.src = "about:blank"; setTimeout(() => f.src = url, 50); });
</script>
</body>
</html>
